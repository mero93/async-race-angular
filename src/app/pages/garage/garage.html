<div class="m-2 flex min-w-full flex-col items-start justify-center gap-5 p-2 md:m-5 md:p-5">
  <h1>Your Garage ({{ store.totalCount() }})</h1>

  <div
    class="inset-2 flex min-w-full items-center justify-start gap-4 rounded-2xl border-2 bg-accent p-2"
  >
    <hlm-dialog #dialog>
      <button
        #createTrigger
        hlmDialogTrigger
        hlmBtn
        variant="outline"
        [disabled]="store.isBusy()"
        (click)="handleOpenCreateModal(dialog)"
        class="group flex shrink-0 items-center gap-2 border-2 border-b-emerald-600 text-emerald-800 transition-colors duration-500 hover:border-emerald-700 hover:text-emerald-900 disabled:pointer-events-none disabled:opacity-50"
      >
        <span class="hidden font-extrabold min-[600px]:inline">New Car</span>
        <svg
          lucideCirclePlus
          class="h-5 w-5 stroke-3 transition-all duration-400 ease-out group-hover:scale-110"
        ></svg>
      </button>

      <hlm-dialog-content *hlmDialogPortal="let ctx" class="w-[95vw] max-w-[800px]! p-4 sm:p-6">
        <hlm-dialog-header>
          <h3 hlmDialogTitle class="text-lg font-bold sm:text-xl">
            {{ selectedCar() ? 'Edit Car' : 'Create New Car' }}
          </h3>
        </hlm-dialog-header>

        <div class="mt-4 max-h-[80vh] w-full overflow-y-auto">
          <app-car-form
            [initialData]="selectedCar()"
            [isBusy]="store.isBusy()"
            (save)="handleSaveCar($event, ctx.close)"
          ></app-car-form>
        </div>
      </hlm-dialog-content>
    </hlm-dialog>

    <button
      hlmBtn
      variant="outline"
      [disabled]="store.isBusy()"
      (click)="handleGenerateCars()"
      class="group flex shrink-0 items-center gap-2 border-2 border-b-violet-400 text-violet-500 transition-colors duration-500 hover:border-violet-600 hover:text-violet-900 disabled:pointer-events-none disabled:opacity-50"
    >
      <span class="hidden font-extrabold min-[600px]:inline">Generate Cars</span>
      <svg
        lucideCog
        class="h-5 w-5 stroke-3 transition-all duration-400 group-hover:rotate-180"
      ></svg>
    </button>

    <span class="flex-1"></span>

    <button
      hlmBtn
      variant="outline"
      [disabled]="store.isBusy()"
      (click)="handleStartRace()"
      class="group flex shrink-0 items-center gap-2 border-2 border-b-amber-400 text-amber-600 transition-colors duration-500 hover:border-amber-700 hover:text-amber-700 disabled:pointer-events-none disabled:opacity-50"
    >
      <span class="hidden font-extrabold min-[480px]:inline">Start Race</span>
      <svg
        lucideFlag
        class="h-5 w-5 stroke-3 transition-all duration-300 ease-out group-hover:rotate-12 group-hover:animate-pulse"
      ></svg>
    </button>

    <button
      hlmBtn
      variant="outline"
      (click)="handleResetRace()"
      class="group flex shrink-0 items-center gap-2 border-2 border-b-rose-500 text-rose-500 transition-colors duration-300 hover:border-rose-600 hover:text-rose-700"
    >
      <span class="hidden font-extrabold min-[480px]:inline">Reset Cars</span>
      <svg
        lucideRotateCcw
        class="h-5 w-5 stroke-3 transition-all duration-400 group-hover:animate-[spin_1s_linear_infinite_reverse]"
      ></svg>
    </button>
  </div>

  <app-car-track-list
    [store]="store"
    (pageChange)="handlePageChange($event)"
    (editCar)="handleOpenEditModal($event, dialog)"
  >
  </app-car-track-list>

  <hlm-dialog
    #winnerDialog
    [state]="isWinnerDialogOpen() ? 'open' : 'closed'"
    (stateChange)="handleWinnerDialogStateChange($event)"
  >
    <hlm-dialog-content
      *hlmDialogPortal="let ctx"
      class="w-[90vw] max-w-[450px] text-center sm:p-6"
    >
      @if (store.raceWinner(); as winner) {
        <hlm-dialog-header class="flex flex-col items-center justify-center gap-2">
          <div
            class="flex h-12 w-12 items-center justify-center rounded-full bg-amber-500/10 ring-8 ring-amber-500/5"
          >
            <svg lucideTrophy class="h-7 w-7 stroke-[2.5] text-amber-500"></svg>
          </div>
          <h3 hlmDialogTitle class="text-2xl font-black tracking-tight text-amber-500">
            Winner Announced!
          </h3>
        </hlm-dialog-header>

        <div class="my-6 flex flex-col items-center justify-center gap-4">
          <div
            class="flex h-24 w-full items-center justify-center rounded-xl border border-border/60 bg-muted/30 p-4 shadow-inner"
          >
            <app-car-view
              [car]="winner.car"
              class="h-16 w-32 drop-shadow-md transition-transform duration-300 hover:scale-110"
            ></app-car-view>
          </div>

          <div class="space-y-1">
            <p class="text-xl font-extrabold tracking-tight text-foreground">
              {{ winner.car.name }}
            </p>
            <p class="text-sm font-medium text-muted-foreground">
              Finished in
              <span class="text-base font-bold text-foreground">{{ winner.time }}s</span>
            </p>
          </div>
        </div>

        <hlm-dialog-footer class="mt-4 flex justify-center">
          <button hlmBtn variant="outline" (click)="ctx.close()">Close</button>
        </hlm-dialog-footer>
      }
    </hlm-dialog-content>
  </hlm-dialog>
</div>
